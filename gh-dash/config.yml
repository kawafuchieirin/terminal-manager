# 公式設定: https://www.gh-dash.dev/configuration/
prSections:
  - title: My PRs
    filters: is:open author:@me
  - title: Review requested
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me

# この環境の clone 配置。別の配置ではローカルで調整する。
repoPaths:
  kawafuchieirin/*: ~/work-space/*

keybindings:
  universal:
    # 選択行ではなく gh-dash を起動したディレクトリのリポジトリを操作する。
    - key: N
      name: Create issue (current directory)
      command: gh issue create
    - key: P
      name: Create PR (current directory)
      command: gh pr create
    - key: G
      name: Lazygit (current directory)
      command: lazygit
