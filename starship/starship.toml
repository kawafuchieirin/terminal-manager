# =========================
# General
# =========================
# コマンド入力前に空行を挿入
add_newline = true

# =========================
# Git Branch
# =========================
[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "

# =========================
# Git Status
# =========================
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
staged = "+${count}"
modified = "!${count}"
untracked = "?${count}"
deleted = "x${count}"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
