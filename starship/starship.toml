# =========================
# General
# =========================
# 二段表示 (Powerlevel10k 風)
format = """
$os$directory$git_branch$git_status$git_state\
$nodejs$python$golang$rust$java$ruby$php\
$docker_context$kubernetes$aws$gcloud\
$line_break\
$character"""

add_newline = true

# =========================
# Prompt Character
# =========================
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# =========================
# OS
# =========================
[os]
disabled = false
format = "[$symbol]($style) "
style = "bold blue"

[os.symbols]
Macos = ""
Linux = ""
Ubuntu = ""

# =========================
# Directory
# =========================
[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
style = "bold cyan"
read_only = " 󰌾"
format = "[ $path]($style)[$read_only]($read_only_style) "

# =========================
# Git
# =========================
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
staged = "+${count}"
modified = "!${count}"
untracked = "?${count}"
deleted = "x${count}"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
style = "bold yellow"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

# =========================
# Languages / Runtimes
# =========================
[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold green"

[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "bold yellow"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold cyan"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold red"

[java]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold red"

[ruby]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold red"

[php]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold blue"

# =========================
# Cloud / Container
# =========================
[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "bold blue"
only_with_files = true

[kubernetes]
symbol = "☸ "
format = '[$symbol$context( \($namespace\))]($style) '
style = "bold cyan"
disabled = false

[aws]
symbol = "  "
format = '[$symbol($profile )(\[$duration\] )]($style)'
style = "bold yellow"

[gcloud]
symbol = " "
format = '[$symbol$account(@$domain)(\($region\))]($style) '
style = "bold blue"
