repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        exclude: ^zsh/

  # Vial のキーマップ（.vil）を整形する。Vial が書き出す 1 行 JSON のままでは
  # diff がファイル全体になり、キーの変更履歴が読めないため
  - repo: local
    hooks:
      - id: format-vil
        name: format .vil (Vial keymap)
        entry: cornix-lp/format-vil.sh
        language: script
        files: \.vil$
